name: Release

# Publica o instalador macOS (.dmg) como asset em GitHub Releases.
# Dispara em tags v* ou manualmente (workflow_dispatch).
#
# Sem secrets Apple: assinatura ad-hoc (signingIdentity "-" no tauri.conf).
# Com secrets (opcional): certificado Developer ID + notarização.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da release (ex: v0.1.0). Criada se ainda não existir."
        required: true
        default: "v0.1.0"

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-macos:
    name: Build DMG + GitHub Release
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/desktop
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: meta
        working-directory: ${{ github.workspace }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          case "$TAG" in
            v*) ;;
            *) TAG="v${TAG}" ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Import Apple certificate (optional)
        id: signing
        working-directory: ${{ github.workspace }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "${APPLE_CERTIFICATE:-}" ]; then
            echo "mode=adhoc" >> "$GITHUB_OUTPUT"
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            echo "Sem APPLE_CERTIFICATE — build com assinatura ad-hoc."
            exit 0
          fi
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          KEYCHAIN_PASSWORD="${KEYCHAIN_PASSWORD:-build-keychain-pass}"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          CERT_ID=$(security find-identity -v -p codesigning build.keychain | awk -F'"' '/Developer ID Application|Apple Distribution|Apple Development/{print $2; exit}')
          if [ -z "$CERT_ID" ]; then
            echo "Certificado importado, mas identidade não encontrada — fallback ad-hoc."
            echo "mode=adhoc" >> "$GITHUB_OUTPUT"
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "APPLE_SIGNING_IDENTITY=$CERT_ID" >> "$GITHUB_ENV"
          echo "mode=signed" >> "$GITHUB_OUTPUT"
          echo "Usando identidade: $CERT_ID"

      - name: Build and publish (Tauri)
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ secrets.APPLE_API_KEY_PATH }}
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
        with:
          projectPath: apps/desktop
          tagName: ${{ steps.meta.outputs.tag }}
          releaseName: Rebobina ${{ steps.meta.outputs.tag }}
          releaseBody: |
            Instalador macOS do Rebobina.

            - Artefato: `Rebobina_*.dmg` (e `.app` no bundle)
            - App macOS-only (ScreenCaptureKit); sem builds Windows/Linux
            - Sem certificado Apple no CI: assinatura **ad-hoc** — na 1ª abertura use clique direito → Abrir
            - Com secrets `APPLE_*`: build assinado (e notarizado se `APPLE_ID`/`APPLE_PASSWORD`/`APPLE_TEAM_ID` ou API key estiverem definidos)

            Após instalar, autorize **Gravação de tela**, **Microfone** e **Notificações**.
          releaseDraft: false
          prerelease: false
          args: --target universal-apple-darwin
