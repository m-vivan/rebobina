name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck + Vite build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      # `npm run build` = `tsc && vite build` (UI only; no Tauri/Xcode)
      - name: Typecheck and build frontend
        run: npm run build

  rust:
    name: Rust (cargo test)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      # Unit tests in audio/mix, pipeline, blackhole, etc.
      # Full `tauri:build` / DMG needs local Xcode + signing; not run in CI yet.
      - name: Run Rust tests
        run: cargo test
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
